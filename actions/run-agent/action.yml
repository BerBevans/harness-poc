name: Run agent
description: >
  Runs one headless Claude Code agent with the factory-harness plugin loaded from this action's own
  copy of the harness, so the plugin is the version the caller pinned in `uses:`. Installs a pinned
  Claude Code, authenticates with a claude setup-token OAuth token, and fails the run at startup
  unless the plugin loaded. The transcript goes to a file, not the job log, which is public on a
  public repo. Deletes the event payload file before the agent starts, because it holds every
  comment on the issue: later steps must read event data from the github context instead. With an
  OTLP endpoint, exports Claude Code's metrics and events, never prompts or tool content.

inputs:
  prompt:
    description: The agent's prompt.
    required: true
  claude-code-oauth-token:
    description: Token from claude setup-token, so usage stays within the subscription.
    required: true
  issue:
    description: >
      The issue the agent is working on. Set as FACTORY_ISSUE, so a hook that blocks the agent tells
      it to comment on the issue and write a progress note.
    default: ''
  model:
    description: The model to use. Leave empty for Claude Code's default.
    default: ''
  role:
    description: The agent's role, such as spec, sent as the factory.role telemetry attribute.
    default: ''
  otel-endpoint:
    description: >
      OTLP/HTTP endpoint for Claude Code's metrics and events. Empty turns telemetry off. Prompts,
      tool content and traces are never exported, whatever the job environment sets.
    default: ''
  otel-headers:
    description: >
      OTLP headers, such as Authorization=Basic%20<base64>, from one secret so the log masks it. Names
      and values are URL-decoded, so a literal space works too. Use a token that can only write
      telemetry: the agent's commands can see the environment.
    default: ''
  max-turns:
    description: The most turns the agent may take before the run stops.
    required: true
  allowed-tools:
    description: >
      The role's permission rules, one per line, such as Read(./**) or Bash(dotnet test *). The run
      is in dontAsk mode, so anything else is refused. A file tool or Bash with no path or command
      is rejected. A fixed deny list, which callers can't change, fences the file tools away from
      /proc, the runner's temp folder, home dotfiles and the plugin.
    required: true

outputs:
  transcript:
    description: Path of the run's transcript, as stream JSON. Keep it private.
    value: ${{ steps.run.outputs.transcript }}

runs:
  using: composite
  steps:
    - name: Run the agent
      id: run
      shell: bash
      env:
        AGENT_PROMPT: ${{ inputs.prompt }}
        AGENT_MODEL: ${{ inputs.model }}
        AGENT_MAX_TURNS: ${{ inputs.max-turns }}
        AGENT_ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
        AGENT_ROLE: ${{ inputs.role }}
        AGENT_OTEL_ENDPOINT: ${{ inputs.otel-endpoint }}
        AGENT_OTEL_HEADERS: ${{ inputs.otel-headers }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        FACTORY_ISSUE: ${{ inputs.issue }}
      run: |
        harness="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)"
        transcript="$RUNNER_TEMP/agent/transcript.jsonl"
        echo "transcript=$transcript" >> "$GITHUB_OUTPUT"
        PLUGIN_DIR="$harness/plugins/factory-harness" \
          node "$harness/plugins/factory-harness/ci/run-agent.mjs" "$RUNNER_TEMP/agent/tool" "$transcript"
