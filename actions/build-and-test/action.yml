name: .NET build and test
description: >
  Builds a solution with the harness's BuildSettings.targets imported last, so the build fails if
  any project's settings are weaker than the factory requires, then fails if any project in the
  solution wasn't checked. Then runs every test project, and fails unless every test ran and
  passed and every test project follows the naming convention. Then measures coverage as two
  figures, core code from unit tests and *.Adapters projects from integration tests: on a push,
  stores it as the branch's baseline, and on a PR, fails if it fell below the target branch's,
  unless someone in override-user-ids applied the coverage-override label. Call it from a workflow
  triggered by pull_request (including labeled and unlabeled) and push, never pull_request_target:
  a build runs the PR's code. The guardrail path check stops a PR changing the workflow that calls this.

inputs:
  solution:
    description: Path to the solution file, relative to the repo root.
    required: true
  configuration:
    description: Build configuration.
    default: Release
  override-user-ids:
    description: >
      Numeric GitHub user IDs whose coverage-override label lets a coverage drop pass. Usually just
      the repo owner. Not logins, which can be renamed and then taken.
    required: true
  github-token:
    description: >
      Token that can read the repo's workflow runs and artifacts (actions read) and the PR's issue
      events (issues read, pull-requests read).
    default: ${{ github.token }}
  baseline-retention-days:
    description: How long a push run's coverage baseline is kept. A PR fails if it has expired.
    default: '90'

runs:
  using: composite
  steps:
    - name: Refuse pull_request_target
      if: github.event_name == 'pull_request_target'
      shell: bash
      run: |
        echo "::error::The build runs the PR's code, so it must not run on pull_request_target, which has the repo's secrets and a write token. Use pull_request."
        exit 1

    - name: Build with the build-settings check
      shell: bash
      env:
        SOLUTION: ${{ inputs.solution }}
        CONFIGURATION: ${{ inputs.configuration }}
      run: |
        harness="$GITHUB_ACTION_PATH/../.."
        report="$RUNNER_TEMP/build-settings-report"
        rm -rf "$report"
        dotnet build "$SOLUTION" -c "$CONFIGURATION" \
          "-p:CustomAfterMicrosoftCommonTargets=$harness/build/BuildSettings.targets" \
          "-p:BuildSettingsReportDir=$report" \
          "-p:FactorySonarLintFile=$GITHUB_WORKSPACE/.github/SonarLint.xml"
        node "$harness/plugins/factory-harness/ci/build-settings-report.mjs" "$SOLUTION" "$report"

    - name: Test, and check that every test ran and passed
      shell: bash
      env:
        SOLUTION: ${{ inputs.solution }}
        CONFIGURATION: ${{ inputs.configuration }}
      run: |
        harness="$GITHUB_ACTION_PATH/../.."
        results="$RUNNER_TEMP/test-results"
        rm -rf "$results"
        # Each test project runs on its own, so coverage can tell unit tests from integration tests.
        status=0
        node "$harness/plugins/factory-harness/ci/run-tests.mjs" "$RUNNER_TEMP/build-settings-report" "$results" "$CONFIGURATION" || status=1
        node "$harness/plugins/factory-harness/ci/test-results.mjs" "$RUNNER_TEMP/build-settings-report" "$results"
        exit $status

    - name: Measure coverage
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../plugins/factory-harness/ci/coverage.mjs" measure \
          "$RUNNER_TEMP/build-settings-report" "$RUNNER_TEMP/test-results" "$RUNNER_TEMP/coverage.json"

    - name: Store coverage as this branch's baseline
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-baseline
        path: ${{ runner.temp }}/coverage.json
        retention-days: ${{ inputs.baseline-retention-days }}

    - name: Find the target branch's coverage
      id: baseline
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/../../plugins/factory-harness/ci/coverage.mjs" find-baseline

    - name: Download the target branch's coverage
      if: github.event_name == 'pull_request'
      uses: actions/download-artifact@v8
      with:
        name: coverage-baseline
        path: ${{ runner.temp }}/coverage-baseline
        run-id: ${{ steps.baseline.outputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Check coverage didn't fall
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OVERRIDE_USER_IDS: ${{ inputs.override-user-ids }}
      run: |
        node "$GITHUB_ACTION_PATH/../../plugins/factory-harness/ci/coverage.mjs" compare \
          "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/coverage-baseline/coverage.json"
