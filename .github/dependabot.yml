# Opens PRs when the GitHub Actions used in workflows, or the .NET SDK pinned in global.json,
# have new versions.
# CI runs on each PR, so a bump is tested before it's merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    # Stay on the products' major version. A move to a new major is made by hand, with the
    # product repos.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
